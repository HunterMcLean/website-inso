# Netlify build + functions config
# When linked to a GitHub repo, every push to the main branch triggers a rebuild.

[build]
  publish = "."
  # Regenerates data/inspiration.js from the (canonical) data/inspiration.json
  # so the file:// double-click flow stays in sync after each editor save.
  command = "node scripts/build-inspiration-js.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cache static assets aggressively; the JSON / JS data files should always be fresh.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# App code must revalidate every load so deploys show up immediately (no stale
# app.js/styles.css). "no-cache" still allows 304s when unchanged — it's cheap,
# not "never cache". This is the fix for the recurring stale-asset problem.
[[headers]]
  for = "/assets/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/styles.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Screenshots are content-addressed by id and rarely change → safe to cache long.
[[headers]]
  for = "/assets/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
